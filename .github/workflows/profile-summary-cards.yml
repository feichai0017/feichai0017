name: Profile Summary Cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: feichai0017
          BRANCH_NAME: main
          UTC_OFFSET: 8
          AUTO_PUSH: false

      - name: Apply visual tweaks to selected cards
        run: |
          set -euo pipefail
          target_files=(
            "profile-summary-card-output/rose_pine/3-stats.svg"
            "profile-summary-card-output/rose_pine/2-most-commit-language.svg"
          )

          for file in "${target_files[@]}"; do
            if [[ -f "${file}" ]]; then
              sed -i "s/font-family: 'Segoe UI', Ubuntu, \"Helvetica Neue\", Sans-Serif/font-family: 'Maple Mono CN', 'Maple Mono', 'SF Mono', 'JetBrains Mono', 'Segoe UI', Ubuntu, \"Helvetica Neue\", Sans-Serif/g" "${file}"
            fi
          done

      - name: Commit and push generated cards
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh profile summary cards"
          git push origin HEAD:main
